version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # auto-release.yml は件名が build(deps で始まるときだけ動く。
    # 指定しないと接頭辞は履歴から推定され、chore(deps) になることがある。
    commit-message:
      prefix: build
      include: scope
    groups:
      # パッチ・マイナー更新はまとめて 1 本の PR にする
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
