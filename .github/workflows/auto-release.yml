name: Auto release

# Dependabot の更新を取り込むと Cargo.lock が変わる。バイナリの中身が変わるので、
# パッチバージョンを上げてタグを打ち、リリースを作り直す。
on:
  push:
    branches: [main]
    paths: ["Cargo.lock"]

permissions:
  contents: write

jobs:
  bump:
    # Dependabot の更新を取り込んだときだけ動く。
    #
    # Cargo.lock は機能追加で依存を足したときにも変わる。それを依存更新と誤認して
    # PATCH を上げると、機能追加が PATCH として出てしまい 12.3.1 の方針に反する。
    # 発火条件を Dependabot 由来に絞る。手動のリリースはこれまでどおりタグを打つ。
    #
    # 自分が作ったバージョン更新コミットで再帰しないよう chore(release): も除く。
    if: >-
      ${{ startsWith(github.event.head_commit.message, 'build(deps')
          && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Bump patch version
        id: bump
        run: |
          set -eu
          CURRENT=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          NEXT=$(echo "$CURRENT" | awk -F. '{printf "%s.%s.%d", $1, $2, $3 + 1}')
          echo "$CURRENT -> $NEXT"

          # 行頭の version は [package] のものだけ。依存はインラインテーブル内なので一致しない
          sed -i "s/^version = \"$CURRENT\"$/version = \"$NEXT\"/" Cargo.toml
          grep -q "^version = \"$NEXT\"$" Cargo.toml
          cargo update --workspace

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$NEXT (依存更新に伴うリビルド)"
          git tag "v$NEXT"
          git push origin HEAD --tags

          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

  release:
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
    permissions:
      contents: write
