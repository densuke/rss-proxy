[package]
name = "rss-proxy"
version = "0.11.1"
edition = "2024"
license = "MIT"
description = "RSS/Atom フィードを取得し、登録した処理を適用して再配信するプロキシ"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["form", "json"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
feed-rs = "2.4.0"
getrandom = "0.4.3"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset"] }
rpassword = "7.5.4"
rss = "2.1.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net"] }

[dev-dependencies]
base64 = "0.23.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
